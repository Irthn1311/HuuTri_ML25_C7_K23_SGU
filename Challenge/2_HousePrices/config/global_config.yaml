# config.yaml
# Nơi lưu cấu hình của model, các tham số,... từ:
#   load data -> clean -> feature engineering -> model -> tuning -> ensemble -> final

# Template:
project:
  name: house-prices
  random_seed: 42

data:
  train: "data/raw/train.csv"
  test: "data/raw/test.csv"
  submission: "data/submissions/submission_quy.csv"

model:
  lightgbm:
    objective: regression
    metric: rmse
    boosting_type: gbdt
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.9
    random_state: 42
